name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # A newer push to a PR cancels its older run; every commit on main keeps its own result.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # Next sends anonymous usage telemetry by default, CI runs included.
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      # The tests never use DATABASE_URL's database: each run creates its own throwaway database
      # on this server and drops it afterwards (tests/int/setup.ts).
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pandora_cms
        ports:
          - 5442:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d pandora_cms"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      # Dummy values: the job only reaches the two containers on this runner, and the variables are
      # read from the environment (there is no .env in CI). Same ports as docker-compose.yml.
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5442/pandora_cms
      PAYLOAD_SECRET: ci-dummy-payload-secret-not-used-anywhere-else
      S3_ENDPOINT: http://127.0.0.1:9100
      S3_BUCKET: pandora-cms-media
      S3_ACCESS_KEY_ID: pandora-ci
      S3_SECRET_ACCESS_KEY: pandora-ci-dummy-secret
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # MinIO must be started with `server /data`, and a service container cannot pass a command.
      # The tests create (and delete) their own throwaway bucket, so no bucket is created here.
      - name: Start MinIO
        run: |
          docker run -d --name minio -p 127.0.0.1:9100:9000 \
            -e MINIO_ROOT_USER="$S3_ACCESS_KEY_ID" \
            -e MINIO_ROOT_PASSWORD="$S3_SECRET_ACCESS_KEY" \
            pgsty/minio:RELEASE.2026-08-04T00-00-00Z server /data
          for attempt in $(seq 1 30); do
            if curl -fsS --max-time 5 -o /dev/null "$S3_ENDPOINT/minio/health/live"; then
              echo "MinIO is live (attempt $attempt)"
              exit 0
            fi
            sleep 2
          done
          echo "MinIO did not become live in time" >&2
          docker logs minio >&2
          exit 1
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run test
      # `next build` needs the six server variables set (any values) but connects to nothing.
      - run: npm run build
      # The production images, built and never pushed. The Dockerfile sets its own dummy build
      # values; nothing from this job's environment reaches an image.
      - name: Build the migrate image
        run: docker build --target migrate -t pandora-cms-migrate:ci .
      - name: Build the app image
        run: docker build -t pandora-cms:ci .
